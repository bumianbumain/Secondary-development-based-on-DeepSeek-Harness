# account-menu Bundle 的 patch 层：在 auth-login 之后插入本 Bundle 的插件行。
#
# node 半 apply() 通过 ctx.webServer.register 暴露两个 HTTP 端点：
#   - GET  /api/biz-user/list     列当前租户下用户（用于弹窗显示现有用户）
#   - POST /api/biz-user/create   admin 角色校验后创建用户并设置初始密码
# 两者都消费 ctx.connection 暴露的 BrowserAuth session 接口（懒读 ctx.connection.sessionIdentity）。
# client 半（./client，见 dsh.client）注册 sidebar.footer.action 槽位，渲染"账号卡 + 下拉菜单"。
#
# 排序：放在 auth-login 之后，确保 BrowserAuth 已就位（sessionIdentity 才能解析）。
- insert:
  - id: account-menu
    name: '@my-company/account-menu'
